services:
  - type: web
    name: usvc-api
    runtime: node
    rootDir: usvc-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: EMAIL_ENABLED
        value: false
      - key: EMAIL_FROM
        value: US Vital Certificates <noreply@usvitalcertificates.org>
      - key: EMAIL_REPLY_TO
        value: support@usvitalcertificates.org
      - key: RESEND_API_KEY
        sync: false
      - key: ANALYTICS_ENABLED
        value: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GA4_MEASUREMENT_PROTOCOL_API_SECRET
        sync: false
      - key: SENSITIVE_ENCRYPTION_KEY
        sync: false
      - key: SENSITIVE_KEY_ID
        value: v1
